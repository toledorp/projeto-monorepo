# Identificador único e organização do projeto no SonarQube
sonar.projectKey=projeto-monorepo
sonar.organization=toledorp
sonar.projectName=Backend API monorepo

#URL do serviço (http://sonarcloud.io ou http://localhost:9000)
sonar.host.url=https://sonarcloud.io

#Diretorio onde o SonarQube irá procurar os arquivos de código-fonte
sonar.sources=src

#Diretorio e padroes de arquivo de teste nde o SonarQube irá procurar os arquivos de teste
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts, src/**/*.spec.ts

#Caminho do relatorios de cobertura no formato lcov, gerado pelo Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

#Pastas e arquivos que não devem ser analisados pelo SonarQube
sonar.exclusions=**/node_modules/**, **/dist/**, **/coverage, src/**/*.test.ts, src/**/*.spec.ts

